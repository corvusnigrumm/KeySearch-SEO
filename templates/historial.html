{% extends "_sidebar.html" %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Historial de Búsquedas</h1>
    <p class="text-gray-400 mt-2">Búsquedas realizadas por el perfil <strong>{{ user.username }}</strong></p>
</div>

<div class="glass-panel p-6 rounded-2xl border border-gray-800 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-600/10 rounded-full blur-3xl -mr-32 -mt-32 pointer-events-none"></div>
    
    <div class="overflow-x-auto relative z-10">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-gray-700 text-sm uppercase text-gray-400 tracking-wider">
                    <th class="py-3 px-4 font-medium">Fecha</th>
                    <th class="py-3 px-4 font-medium">Keyword Principal</th>
                    <th class="py-3 px-4 font-medium">País</th>
                    <th class="py-3 px-4 font-medium">Modo/Perfil</th>
                    <th class="py-3 px-4 text-right font-medium">Acción</th>
                </tr>
            </thead>
            <tbody id="history-body" class="text-gray-300">
                <!-- Se llenará via JS -->
            </tbody>
        </table>
        
        <div id="loading" class="py-12 text-center text-gray-500">
            <svg class="animate-spin h-8 w-8 mx-auto mb-4 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Cargando historial...
        </div>
        
        <div id="empty-state" class="hidden py-12 text-center">
            <p class="text-gray-500">No tienes búsquedas en tu historial aún.</p>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('/api/history')
        .then(response => response.json())
        .then(data => {
            document.getElementById('loading').classList.add('hidden');
            const tbody = document.getElementById('history-body');
            
            if (!data.history || data.history.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            
            data.history.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-800/50 hover:bg-gray-800/30 transition-colors";
                
                // Formatear fecha
                const d = new Date(item.created_at);
                const fecha = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                tr.innerHTML = `
                    <td class="py-4 px-4 text-sm text-gray-400">${fecha}</td>
                    <td class="py-4 px-4 font-medium text-white">${item.keyword}</td>
                    <td class="py-4 px-4"><span class="px-2 py-1 bg-gray-800 rounded text-xs">${item.country}</span></td>
                    <td class="py-4 px-4 text-sm text-gray-400">${item.profile}</td>
                    <td class="py-4 px-4 text-right">
                        <a href="/download/history/${item.id}" class="inline-flex items-center px-3 py-1 bg-green-600/20 text-green-400 hover:bg-green-600/30 rounded border border-green-600/30 transition-colors text-sm">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Excel
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('loading').innerHTML = '<span class="text-red-400">Error al cargar el historial</span>';
        });
});
</script>
{% endblock %}
